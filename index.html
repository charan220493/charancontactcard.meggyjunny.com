    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap');

      :root {
        --cream: #fffcfa;
        --cream-medium: #f9eee6;
        --sage: #d7ddca;
        --green: #2e523a;
        --brown: #554234;
        --orange-dark: #976c49;
        --border: #eae0d7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--sage);
        color: var(--brown);
        font-family: 'Nunito', Arial, sans-serif;
      }

      main {
        width: min(100%, 560px);
        min-height: 100svh;
        margin: 0 auto;
        padding: 28px 20px 36px;
        background: var(--cream);
      }

      .identity {
        text-align: center;
        padding: 6px 12px 26px;
      }

      .identity img {
        display: block;
        width: min(100%, 236px);
        height: auto;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0;
        color: var(--green);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(2.35rem, 11vw, 3.35rem);
        font-weight: 700;
        line-height: .96;
        overflow-wrap: anywhere;
      }

      .title {
        margin: 12px 0 0;
        color: var(--orange-dark);
        font-family: 'Quicksand', 'Nunito', Arial, sans-serif;
        font-size: 1rem;
        font-weight: 700;
      }

      .contact {
        margin: 0 0 24px;
        padding: 23px 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--cream-medium);
        display: grid;
        gap: 8px;
        text-align: center;
      }

      .contact a {
        display: inline-block;
        max-width: 100%;
        color: var(--brown);
        font-size: .95rem;
        font-weight: 700;
        line-height: 1.7;
        overflow-wrap: anywhere;
        text-decoration-color: var(--orange-dark);
        text-underline-offset: 3px;
      }

      .contact span { display: none; }

      .actions {
        display: grid;
        gap: 12px;
      }

      .action {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 12px 18px;
        border: 1px solid var(--green);
        border-radius: 14px;
        color: var(--cream);
        background: var(--green);
        font-family: 'Quicksand', 'Nunito', Arial, sans-serif;
        font-size: 1rem;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }

      .action:hover,
      .action:focus-visible { background: #254630; }

      .action.secondary {
        color: var(--green);
        background: transparent;
      }

      .action.secondary:hover,
      .action.secondary:focus-visible { background: var(--cream-medium); }

      .action:focus-visible,
      .contact a:focus-visible { outline: 3px solid var(--orange-dark); outline-offset: 3px; }

      @media (min-width: 520px) {
        main { min-height: auto; margin-top: 30px; margin-bottom: 30px; border-radius: 24px; box-shadow: 0 16px 44px rgb(85 66 52 / 16%); }
        .actions { grid-template-columns: 1fr 1fr; }
        .action:last-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="identity" aria-labelledby="name">
        <img src="meggy-junny-logo-transparent.png" alt="Meggy &amp; Junny" />
        <h1 id="name">Charan Puladas</h1>
        <p class="title">Co-founder</p>
      </section>

      <section class="contact" aria-label="Contact details">
        <a href="mailto:founders@meggyjunny.com">founders@meggyjunny.com</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.meggyjunny.com">www.meggyjunny.com</a>
      </section>

      <nav class="actions" aria-label="Contact actions">
        <a class="action" href="tel:+91-7793966718">Call</a>
        <a class="action" href="mailto:founders@meggyjunny.com">Email</a>
        <a class="action secondary" href="https://www.meggyjunny.com">Visit website</a>
        <a class="action secondary" href="charan-puladas.vcf" download>Save contact</a>
      </nav>
    </main>
  </body>
